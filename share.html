<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shared Project | J-SYRO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #090d14;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .topbar {
            height: 56px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16px;

            background: #121721;
            border-bottom: 1px solid #29313d;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .logo {
            font-weight: 900;
            font-size: 17px;
        }

        .logo span {
            color: #7568ff;
        }

        .project-details {
            min-width: 0;
        }

        #projectName {
            color: #f3f5f8;
            font-size: 12px;
            font-weight: 700;

            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .label {
            margin-top: 2px;
            color: #7d8797;
            font-size: 9px;
            letter-spacing: 0.8px;
        }

        .home-button {
            padding: 9px 13px;

            color: #ffffff;
            background: #1d2430;

            border: 1px solid #343e4c;
            border-radius: 8px;

            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
        }

        .viewer {
            position: relative;

            width: 100%;
            height: calc(100vh - 56px);

            background: #ffffff;
        }

        #projectFrame {
            width: 100%;
            height: 100%;

            display: block;

            border: 0;
            background: #ffffff;
        }

        #statusScreen {
            position: absolute;
            inset: 0;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #090d14;
        }

        .status-card {
            width: min(420px, 100%);

            padding: 34px;

            text-align: center;

            background: #141a24;

            border: 1px solid #2d3745;
            border-radius: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;

            margin: 0 auto 20px;

            border: 3px solid #303947;
            border-top-color: #7568ff;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status-card h1 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .status-card p {
            margin: 0;

            color: #929cac;

            font-size: 13px;
            line-height: 1.6;
        }

        .error-icon {
            width: 45px;
            height: 45px;

            display: grid;
            place-items: center;

            margin: 0 auto 18px;

            color: #ff9aaa;
            background: rgba(255, 80, 100, 0.1);

            border: 1px solid rgba(255, 80, 100, 0.3);
            border-radius: 12px;

            font-size: 22px;
        }

        @media (max-width: 600px) {
            .project-details {
                display: none;
            }

            .topbar {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand-area">

        <div class="logo">
            J<span>-SYRO</span>
        </div>

        <div class="project-details">

            <div id="projectName">
                Loading project...
            </div>

            <div class="label">
                SHARED PROJECT PREVIEW
            </div>

        </div>

    </div>

    <a
        class="home-button"
        href="index.html"
    >
        J-SYRO
    </a>

</header>


<main class="viewer">

    <iframe
        id="projectFrame"
        title="Shared Project"
        sandbox="
            allow-scripts
            allow-forms
            allow-modals
            allow-popups
            allow-downloads
        "
    ></iframe>


    <div id="statusScreen">

        <div class="status-card">

            <div class="spinner"></div>

            <h1>
                Loading project
            </h1>

            <p>
                J-SYRO is preparing the shared website.
            </p>

        </div>

    </div>

</main>

<script src="share.js" defer></script>


</body>
</html>
